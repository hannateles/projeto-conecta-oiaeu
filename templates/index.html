
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Conecta OIAEU</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- CABECALHO -->

    <header class="header">

        <a href="/" class="logo">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo Conecta OIAEU">
        </a>

        <a href="/login" class="login-adm">
            Login ADM
        </a>

    </header>


    <!-- CONTEUDO PRINCIPAL -->

    <main class="container">

        <section class="banner">

            <!-- IMAGEM -->

            <div class="banner-image">

                <img
                    src="{{ url_for('static', filename='images/banner.jfif') }}"
                    alt="Conecta OIAEU - Transformando vidas">

            </div>


            <!-- BOTOES -->

            <div class="botoes">

                <a href="/cadastro" class="btn-cadastrar">
                    Cadastrar-se
                </a>

                <a href="/login" class="btn-login">
                    Login Voluntário
                </a>

            </div>

        </section>

    </main>

</body>

</html>
